<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ff2e78">
<meta name="description" content="KYDLAB3D - Gestor de taller">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>KYDLAB3D</title>

<style>
:root{
 --bg:#f4f7fb;--panel:#fff;--soft:#f8fafc;--line:#e3e8ef;
 --text:#171d2d;--gray:#667085;--pink:#ff2e78;--cyan:#11a7d8;
 --green:#168653;--red:#c62828;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
body.dark{
 --bg:#0b1220;--panel:#101a2a;--soft:#0d1727;--line:#1d2b3d;
 --text:#e7edf8;--gray:#aebbd0;
}
button,input,select,textarea{font:inherit}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:bold;cursor:pointer}
header{
 position:sticky;top:0;z-index:10;background:var(--panel);
 border-bottom:1px solid var(--line);padding:14px 3%
}
.topbar,main,.panel-header,.item-top,.actions,.metrics,.layout{
 display:flex
}
.topbar{justify-content:space-between;align-items:center;gap:12px}
.brand{font-size:22px;font-weight:bold}
.brand small{display:block;font-size:11px;color:var(--gray);margin-top:3px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
main{width:min(1200px,94%);margin:25px auto;flex-direction:column}
.hero,.panel{
 background:var(--panel);border:1px solid var(--line);
 border-radius:18px;padding:22px
}
.hero{margin-bottom:22px}
.hero h1{font-size:clamp(34px,6vw,58px);line-height:1;margin:12px 0}
.hero p{color:var(--gray)}
.badge{
 display:inline-block;padding:7px 12px;border-radius:20px;
 background:#e9faff;font-size:12px;font-weight:bold
}
.layout{gap:22px}
.column{width:50%}
.panel{margin-bottom:22px}
.panel-header{justify-content:space-between;align-items:center}
.metrics{gap:12px;margin-top:20px;flex-wrap:wrap}
.metric{
 flex:1;min-width:150px;background:var(--soft);
 border:1px solid var(--line);border-radius:14px;padding:15px
}
.metric span{display:block;color:var(--gray);font-size:12px}
.metric strong{display:block;font-size:24px;margin-top:7px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-weight:bold;font-size:12px;margin:10px 0 5px}
input,select,textarea{
 width:100%;border:1px solid var(--line);border-radius:9px;
 padding:10px;background:var(--panel);color:var(--text)
}
textarea{min-height:75px}
.primary{background:var(--pink);color:white}
.secondary{background:#dff5ff;color:var(--text)}
.ghost{background:var(--soft);color:var(--text);border:1px solid var(--line)}
.danger{background:transparent;color:var(--red)}
.actions{gap:8px;flex-wrap:wrap;margin-top:12px}
.item{
 border:1px solid var(--line);border-radius:14px;
 background:var(--soft);padding:14px;margin-top:12px
}
.item-top{justify-content:space-between;gap:10px}
.item h3{margin:0 0 5px}
.muted{color:var(--gray);font-size:13px}
.stock{height:8px;background:#dde4eb;border-radius:20px;margin-top:10px;overflow:hidden}
.stock div{height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink))}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:5px 9px;font-size:12px}
.photo{width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-top:10px}
.answer{margin-top:12px;padding:12px;border-radius:12px;background:#dff8ff;white-space:pre-line}
.profit{color:var(--green)!important}
.loss{color:var(--red)!important}

.lock{
 position:fixed;z-index:1000;inset:0;
 display:grid;place-items:center;background:#10131f;padding:20px
}
.lock-card{
 width:min(400px,100%);padding:28px;border-radius:22px;
 background:#171c2a;color:white;text-align:center
}
.lock-card h2{margin-top:0;font-size:28px}
.lock-card input{
 background:#0e1320;border:1px solid #354052;color:white;
 text-align:center;font-size:20px;letter-spacing:.2em
}
.lock-card button{width:100%;margin-top:12px}

dialog{width:min(850px,94%);border:0;border-radius:16px;padding:0}
dialog::backdrop{background:rgba(0,0,0,.55)}
.invoice{background:white;color:#111;padding:30px;max-width:820px;margin:auto}
.invoice-header{display:flex;justify-content:space-between;border-bottom:2px solid #111;padding-bottom:14px}
.invoice table{width:100%;border-collapse:collapse;margin-top:18px}
.invoice th,.invoice td{border-bottom:1px solid #ddd;padding:9px;text-align:left}
.invoice-total{text-align:right;font-size:20px;font-weight:bold;margin-top:18px}

@media(max-width:800px){
 .layout{flex-direction:column}
 .column{width:100%}
 .metrics{flex-direction:column}
 .topbar{align-items:flex-start}
}
@media(max-width:600px){
 .topbar{flex-direction:column}
 .form-grid{grid-template-columns:1fr}
}

@media print{
 body *{visibility:hidden}
 dialog,dialog *{visibility:visible}
 dialog{position:absolute;inset:0;width:100%}
}
</style>
</head>
<body>
<header>
 <div class="topbar">
  <div class="brand">KYDLAB3D<small>Taller · inventario · ventas</small></div>
  <div class="toolbar">
   <button class="secondary" onclick="toggleTheme()">Modo</button>
   <button class="secondary" id="installBtn" style="display:none" onclick="installApp()">Instalar</button>
   <button class="secondary" onclick="exportBackup()">Copia</button>
   <label class="secondary" style="padding:10px;border-radius:10px;cursor:pointer">
    Restaurar
    <input type="file" accept=".json,application/json" onchange="importBackup(this)" hidden>
   </label>
  </div>
 </div>
</header>

<main>
<section class="hero">
 <span class="badge">GESTOR MAKER</span>
 <h1>De la idea a la última capa.</h1>
 <p>Administra bobinas, proyectos, fotos y facturas.</p>
 <div class="metrics">
  <div class="metric"><span>Bobinas</span><strong id="metricFilaments">0</strong></div>
  <div class="metric"><span>Proyectos</span><strong id="metricProjects">0</strong></div>
  <div class="metric"><span>Ganancias</span><strong class="profit" id="metricProfit">$0.00</strong></div>
  <div class="metric"><span>Pérdidas</span><strong class="loss" id="metricLoss">$0.00</strong></div>
 </div>
</section>

<div class="layout">
 <div class="column">
  <section class="panel">
   <div class="panel-header">
    <h2>Filamentos</h2>
    <button class="primary" onclick="document.getElementById('filamentBrand').focus()">+ Añadir</button>
   </div>
   <form id="filamentForm">
    <div class="form-grid">
     <div><label>Marca</label><input id="filamentBrand" required></div>
     <div><label>Material</label>
      <select id="filamentMaterial"><option>PLA</option><option>PETG</option><option>ABS</option><option>TPU</option></select>
     </div>
     <div><label>Color</label><input id="filamentColor" required></div>
     <div><label>Gramos iniciales</label><input id="filamentGrams" type="number" min="1" required></div>
     <div><label>Precio USD</label><input id="filamentPrice" type="number" min="0" step=".01" required></div>
     <div><label>Descuento %</label><input id="filamentDiscount" type="number" min="0" max="100" value="0"></div>
    </div>
    <div class="actions"><button class="primary">Guardar</button></div>
   </form>
   <div id="filamentList"></div>
  </section>

  <section class="panel">
   <h2>Resumen</h2>
   <div id="summary" class="muted">Sin proyectos.</div>
  </section>
 </div>

 <div class="column">
  <section class="panel">
   <h2>Proyecto</h2>
   <form id="projectForm">
    <div class="form-grid">
     <div><label>Nombre</label><input id="projectName" required></div>
     <div><label>Precio vendido USD</label><input id="projectSale" type="number" min="0" step=".01" required></div>
     <div><label>Impuestos USD</label><input id="projectTax" type="number" min="0" step=".01" value="0"></div>
     <div><label>Foto</label><input id="projectPhoto" type="file" accept="image/*"></div>
    </div>
    <label>Descripción</label><textarea id="projectDescription"></textarea>
    <h3>Colores</h3>
    <div id="colorLines"></div>
    <div class="actions">
     <button type="button" class="ghost" onclick="addLine()">+ Añadir bobina</button>
     <button class="primary">Guardar proyecto</button>
    </div>
   </form>
   <div id="projectList"></div>
  </section>

  <section class="panel">
   <h2>Consulta rápida</h2>
   <textarea id="question" placeholder="¿Qué tengo? ¿Qué proyectos tienen ganancia?"></textarea>
   <div class="actions">
    <button class="primary" onclick="ask()">Consultar</button>
    <button class="secondary" onclick="quick('stock')">Inventario</button>
    <button class="secondary" onclick="quick('profit')">Ganancias</button>
   </div>
   <div id="answer"></div>
  </section>
 </div>
</div>
</main>

<dialog id="invoiceModal">
 <div class="invoice" id="invoiceContent"></div>
</dialog>

<script>
const DB_NAME="kydlab3d";
const STORE="state";
const PIN_KEY="kydlab3d_pin";

let state={theme:"light",filaments:[],projects:[]};
let photo="",editingProject=null,deferredPrompt=null;

function openDB(){
 return new Promise((resolve,reject)=>{
  const r=indexedDB.open(DB_NAME,1);
  r.onupgradeneeded=e=>{
   const db=e.target.result;
   if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE);
  };
  r.onsuccess=()=>resolve(r.result);
  r.onerror=()=>reject(r.error);
 });
}
async function dbGet(){
 const db=await openDB();
 return new Promise((resolve,reject)=>{
  const tx=db.transaction(STORE,"readonly");
  const r=tx.objectStore(STORE).get("main");
  r.onsuccess=()=>resolve(r.result||null);
  r.onerror=()=>reject(r.error);
 });
}
async function dbSet(){
 const db=await openDB();
 return new Promise((resolve,reject)=>{
  const tx=db.transaction(STORE,"readwrite");
  const r=tx.objectStore(STORE).put(state,"main");
  r.onsuccess=()=>resolve();
  r.onerror=()=>reject(r.error);
 });
}

async function save(){await dbSet();render()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function money(v){return Number(v||0).toLocaleString("en-US",{style:"currency",currency:"USD"})}
function esc(v){return String(v||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function effective(f){return Number(f.price||0)*(1-Number(f.discount||0)/100)}
function cost(p){
 return p.lines.reduce((sum,l)=>{
  const f=state.filaments.find(x=>x.id===l.filamentId);
  if(!f)return sum;
  return sum+(effective(f)/f.initial)*Number(l.grams);
 },0);
}
function result(p){return Number(p.sale||0)-cost(p)-Number(p.tax||0)}

function submitPin(){
 const pin=document.getElementById("pin").value.trim();
 if(!/^\d{4,6}$/.test(pin)){alert("Usa un PIN de 4 a 6 números");return}
 const saved=localStorage.getItem(PIN_KEY);
 if(!saved){localStorage.setItem(PIN_KEY,pin)}
 else if(saved!==pin){alert("PIN incorrecto");return}
 document.getElementById("lock").style.display="none";
}
function changePin(){
 if(confirm("¿Cambiar el PIN?"))localStorage.removeItem(PIN_KEY);
 document.getElementById("lockText").textContent="Crea un nuevo PIN";
}
async function initLock(){
 if(!localStorage.getItem(PIN_KEY))document.getElementById("lockText").textContent="Crea tu PIN";
}

function toggleTheme(){
 state.theme=state.theme==="dark"?"light":"dark";
 document.body.classList.toggle("dark",state.theme==="dark");
 dbSet();
}

document.getElementById("filamentForm").onsubmit=async e=>{
 e.preventDefault();
 const initial=Number(document.getElementById("filamentGrams").value);
 state.filaments.push({
  id:uid(),
  brand:document.getElementById("filamentBrand").value.trim(),
  material:document.getElementById("filamentMaterial").value,
  color:document.getElementById("filamentColor").value.trim(),
  initial,
  remaining:initial,
  price:Number(document.getElementById("filamentPrice").value),
  discount:Number(document.getElementById("filamentDiscount").value||0)
 });
 e.target.reset();
 await save();
};

document.getElementById("projectPhoto").onchange=e=>{
 const file=e.target.files[0];
 if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>photo=reader.result;
 reader.readAsDataURL(file);
};

function addLine(data={}){
 const box=document.createElement("div");
 box.className="item";
 box.innerHTML=`
  <div class="form-grid">
   <div><label>Bobina</label>
    <select class="lineFilament" required>
     <option value="">Seleccionar</option>
     ${state.filaments.map(f=>`<option value="${f.id}" ${data.filamentId===f.id?"selected":""}>${esc(f.brand)} ${esc(f.color)} (${f.remaining} g)</option>`).join("")}
    </select>
   </div>
   <div><label>Gramos usados</label><input class="lineGrams" type="number" min=".01" step=".01" value="${data.grams||""}" required></div>
  </div>
  <div class="actions"><button type="button" class="danger" onclick="this.closest('.item').remove()">Quitar</button></div>`;
 document.getElementById("colorLines").appendChild(box);
}

function restoreStock(id){
 const p=state.projects.find(x=>x.id===id);
 if(!p)return;
 p.lines.forEach(l=>{
  const f=state.filaments.find(x=>x.id===l.filamentId);
  if(f)f.remaining+=Number(l.grams);
 });
}

document.getElementById("projectForm").onsubmit=async e=>{
 e.preventDefault();
 const lines=[...document.querySelectorAll("#colorLines .item")].map(box=>({
  filamentId:box.querySelector(".lineFilament").value,
  grams:Number(box.querySelector(".lineGrams").value)
 }));
 if(!lines.length){alert("Añade al menos una bobina");return}

 const grouped={};
 for(const l of lines){
  if(!l.filamentId||l.grams<=0){alert("Revisa el proyecto");return}
  grouped[l.filamentId]=(grouped[l.filamentId]||0)+l.grams;
 }

 for(const [filamentId,grams] of Object.entries(grouped)){
  const f=state.filaments.find(x=>x.id===filamentId);
  if(!f)return;
  let available=f.remaining;
  if(editingProject){
   const old=state.projects.find(p=>p.id===editingProject);
   old.lines.filter(l=>l.filamentId===filamentId).forEach(l=>available+=Number(l.grams));
  }
  if(grams>available){alert(`Stock insuficiente: ${available} g disponibles`);return}
 }

 if(editingProject){
  restoreStock(editingProject);
  state.projects=state.projects.filter(p=>p.id!==editingProject);
 }

 const p={
  id:editingProject||uid(),
  name:document.getElementById("projectName").value,
  description:document.getElementById("projectDescription").value,
  sale:Number(document.getElementById("projectSale").value),
  tax:Number(document.getElementById("projectTax").value||0),
  lines,photo:photo||"",createdAt:new Date().toISOString()
 };

 lines.forEach(l=>{
  const f=state.filaments.find(x=>x.id===l.filamentId);
  f.remaining-=l.grams;
 });
 state.projects.push(p);
 editingProject=null;photo="";
 e.target.reset();
 document.getElementById("colorLines").innerHTML="";
 addLine();
 await save();
};

function render(){
 document.body.classList.toggle("dark",state.theme==="dark");
 document.getElementById("metricFilaments").textContent=state.filaments.length;
 document.getElementById("metricProjects").textContent=state.projects.length;

 let profit=0,loss=0;
 state.projects.forEach(p=>{
  const r=result(p);r>=0?profit+=r:loss+=Math.abs(r);
 });
 document.getElementById("metricProfit").textContent=money(profit);
 document.getElementById("metricLoss").textContent=money(loss);

 document.getElementById("filamentList").innerHTML=state.filaments.length?
 state.filaments.map(f=>{
  const pct=Math.min(100,f.remaining/f.initial*100);
  return `<div class="item">
   <div class="item-top"><h3>${esc(f.brand)} · ${esc(f.color)}</h3><strong>${f.remaining.toFixed(2)} g</strong></div>
   <div class="muted">${esc(f.material)} · ${f.discount}% descuento</div>
   <div class="stock"><div style="width:${pct}%"></div></div>
   <div class="muted">Coste: ${money(effective(f))} · ${money(effective(f)/f.initial)} por gramo</div>
   <div class="actions"><button class="danger" onclick="deleteFilament('${f.id}')">Eliminar</button></div>
  </div>`;
 }).join(""):'<p class="muted">No hay bobinas.</p>';

 document.getElementById("projectList").innerHTML=state.projects.length?
 [...state.projects].reverse().map(p=>`
  <div class="item">
   <div class="item-top"><h3>${esc(p.name)}</h3><strong class="${result(p)>=0?'profit':'loss'}">${money(result(p))}</strong></div>
   <div class="muted">Venta: ${money(p.sale)} · Impuestos: ${money(p.tax)}</div>
   <div class="chips">${p.lines.map(l=>{
    const f=state.filaments.find(x=>x.id===l.filamentId);
    return `<span class="chip">${esc(f?f.color:"Color")} · ${l.grams} g</span>`;
   }).join("")}</div>
   ${p.description?`<div class="muted" style="margin-top:8px">${esc(p.description)}</div>`:""}
   ${p.photo?`<img class="photo" src="${p.photo}">`:""}
   <div class="actions">
    <button class="secondary" onclick="invoice('${p.id}')">Factura</button>
    <button class="ghost" onclick="editProject('${p.id}')">Editar</button>
    <button class="danger" onclick="deleteProject('${p.id}')">Eliminar</button>
   </div>
  </div>`).join(""):'<p class="muted">No hay proyectos.</p>';

 const revenue=state.projects.reduce((s,p)=>s+Number(p.sale),0);
 const cost=state.projects.reduce((s,p)=>s+cost(p),0);
 document.getElementById("summary").innerHTML=`
  <p><strong>Ingresos:</strong> ${money(revenue)}</p>
  <p><strong>Coste material:</strong> ${money(cost)}</p>
  <p><strong>Proyectos:</strong> ${state.projects.length}</p>`;
}

async function deleteFilament(id){
 if(!confirm("¿Eliminar bobina?"))return;
 state.filaments=state.filaments.filter(f=>f.id!==id);
 await save();
}
async function deleteProject(id){
 if(!confirm("¿Eliminar proyecto?"))return;
 restoreStock(id);
 state.projects=state.projects.filter(p=>p.id!==id);
 await save();
}
function editProject(id){
 const p=state.projects.find(x=>x.id===id);
 if(!p)return;
 editingProject=id;photo=p.photo||"";
 document.getElementById("projectName").value=p.name;
 document.getElementById("projectSale").value=p.sale;
 document.getElementById("projectTax").value=p.tax||0;
 document.getElementById("projectDescription").value=p.description||"";
 document.getElementById("colorLines").innerHTML="";
 p.lines.forEach(l=>addLine(l));
 window.scrollTo(0,0);
}
function invoice(id){
 const p=state.projects.find(x=>x.id===id);
 if(!p)return;
 const rows=p.lines.map(l=>{
  const f=state.filaments.find(x=>x.id===l.filamentId);
  const c=f?(effective(f)/f.initial)*l.grams:0;
  return `<tr><td>${esc(f?f.brand:"Bobina")}</td><td>${esc(f?f.material:"-")}</td><td>${l.grams} g</td><td>${money(c)}</td></tr>`;
 }).join("");
 document.getElementById("invoiceContent").innerHTML=`
  <div class="invoice-header"><h2>KYDLAB3D</h2><div><strong>Factura</strong><br>${new Date(p.createdAt).toLocaleDateString("es-ES")}</div></div>
  <h3>${esc(p.name)}</h3>
  <p>${esc(p.description||"Sin descripción")}</p>
  <table><thead><tr><th>Filamento</th><th>Material</th><th>Gramos</th><th>Coste</th></tr></thead><tbody>${rows}</tbody></table>
  <div class="invoice-total">
   <div>Impuestos: ${money(p.tax)}</div>
   <div>Total venta: ${money(Number(p.sale)+Number(p.tax))}</div>
  </div>
  <div class="actions"><button class="primary" onclick="window.print()">Guardar PDF</button><button onclick="document.getElementById('invoiceModal').close()">Cerrar</button></div>`;
 document.getElementById("invoiceModal").showModal();
}

function quick(type){
 document.getElementById("question").value=type==="stock"?"¿Qué tengo en inventario?":"¿Qué proyectos tienen ganancia?";
 ask();
}
function ask(){
 const q=document.getElementById("question").value.toLowerCase();
 let text="";
 if(q.includes("ganancia")||q.includes("rentable")){
  text=state.projects.filter(p=>result(p)>0).map(p=>`${p.name}: ${money(result(p))}`).join("\n")||"No hay ganancias.";
